<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player</title>
  <style>
    body{margin:10px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:#fff;background:#111}
    .wrap{display:flex;align-items:center;gap:10px}
    .title{flex:1;font-size:13px}
    button{background:#2b6df6;border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer}
    .time{font-size:12px;color:#ddd;min-width:48px;text-align:right}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title" id="pw-title">Cargando...</div>
    <button id="pw-play">▶</button>
    <div class="time" id="pw-time">0:00</div>
  </div>

  <audio id="pw-audio" preload="auto" style="display:none"></audio>

  <script>
    (function(){
      var STORAGE_KEY = 'simple_music_bar_v1';
      var pwAudio = document.getElementById('pw-audio');
      var titleEl = document.getElementById('pw-title');
      var playBtn = document.getElementById('pw-play');
      var timeEl = document.getElementById('pw-time');
      var channel = null;

      function readState(){ try{ var r = localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):{}; }catch(e){return{}} }
      function saveState(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }

      try{ channel = new BroadcastChannel('music-player'); }catch(e){ channel = null; }

      var playlist = [];
      // We'll wait for the first SET_PLAYLIST or SET_TRACK message to load sources

      function postState(){ if(!channel) return; channel.postMessage({ type:'STATE', playing:!pwAudio.paused, index: window.__pw_index || 0, volume: pwAudio.volume, currentTime: pwAudio.currentTime, duration: pwAudio.duration || 0 }); }

      playBtn.addEventListener('click', function(){ if(pwAudio.paused){ pwAudio.play(); } else { pwAudio.pause(); } });

      pwAudio.addEventListener('play', postState);
      pwAudio.addEventListener('pause', postState);
      pwAudio.addEventListener('timeupdate', function(){ var t = Math.floor(pwAudio.currentTime||0); timeEl.textContent = Math.floor(t/60)+':'+(''+(t%60)).padStart(2,'0'); postState(); });
      pwAudio.addEventListener('ended', function(){ // auto next
        var idx = (window.__pw_index||0) + 1; if(playlist.length) idx = idx % playlist.length; if(playlist[idx]){ setTrack(idx,true); } else { postState(); }
      });

      function setTrack(i, autoplay){ window.__pw_index = i; var url = (playlist && playlist[i] && playlist[i].url) || ''; var t = (playlist && playlist[i] && playlist[i].title) || ''; if(url){ pwAudio.src = url; pwAudio.load(); titleEl.textContent = t; if(autoplay) pwAudio.play(); } saveState({ index: window.__pw_index, volume: pwAudio.volume }); postState(); }

      function setPlaylist(p){ playlist = p || []; }

      if(channel){
        channel.onmessage = function(ev){ var m = ev.data; if(!m || !m.type) return; switch(m.type){
          case 'SET_PLAYLIST': setPlaylist(m.playlist||[]); break;
          case 'SET_TRACK': setTrack(m.index||0, m.autoplay); break;
          case 'PLAY': pwAudio.play(); break;
          case 'PAUSE': pwAudio.pause(); break;
          case 'TOGGLE_PLAY': if(pwAudio.paused) pwAudio.play(); else pwAudio.pause(); break;
          case 'SET_VOLUME': pwAudio.volume = (typeof m.volume === 'number') ? m.volume : pwAudio.volume; saveState({ index: window.__pw_index, volume: pwAudio.volume }); postState(); break;
          case 'REQUEST_STATE': postState(); break;
        }};
      }

      // Restore last state on load
      (function(){ var st = readState(); if(typeof st.index === 'number') window.__pw_index = st.index; if(typeof st.volume === 'number') pwAudio.volume = st.volume; })();

      // Periodic state ping so pages can sync
      setInterval(postState, 1000);

      // Announce ready
      if(channel) channel.postMessage({ type:'PLAYER_READY' });
    })();
  </script>
</body>
</html>
